<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<style type="text/css">
	*
	{
		margin: 0;
		padding: 0;
		box-sizing: border-box;
		font-family: Arial, sans-serif;
		background: white;

	}
	body
	{
		height: 100vh;
		display: flex;
		justify-content: center;
		align-items: center;
		background: linear-gradient(blue,white,blue);
	}
	.clock
	{
		text-align: 100vh;
		background: white;
		padding: 30px;
		border-radius: 10px;
		box-shadow: 0 0 15px cyan;
	}
	h1
	{
		border: 2px ;
		color: black;
		margin-bottom: 20px;
		height: 150px;
		width: 250px;
		box-shadow: 0 8px 25px rgba(0, 0, 0, 1.0);
		background: linear-gradient(to right,black,white);
		padding-left: 60px;
		padding-top: 60px;
		border-radius: 20%;
	}
	#time
	{
		font-size: 50px;
		color: cyan;
		font-weight: bold;

	}
</style>

<body>
<h1 id="clock">00:00:00</h1>
<script type="text/javascript">
	function showTime(){
		let date = new Date();
		let hours = date.getHours();
		let minutes = date.getMinutes();
		let seconds = date.getSeconds();
		document.getElementById("clock").innerHTML = 
		hours + ":" + minutes + ":" + seconds;
	}
	setInterval(showTime,1000);
</script>
</body>
</html>
