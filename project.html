<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style type="text/css">
body
	{
	 border: 2px solid black;
	  height:100vh;
	 width: 100%;
     background:linear-gradient(black,purple);
     color: white;
     font-size: 20px;
	}
	
	nav
	{
		background: black;
		padding: 12px;


		text-align: center;
	}
	nav a
	{
		color: white;
		text-decoration: none;
		margin: 0 15px;
		font-size: 18px;
	}
	nav a:hover
	{
		color: purple;
	}

	.project
	{
		width: 90%;
		max-height: 1100px;
		margin: 40px auto;
		display: grid;
		grid-template-columns: repeat(3, 1fr);
		gap: 25px;
	}
	.card
	{
		width: 250px;
		padding: 20px;
		border: 1px solid #8e44ab;
		border-radius: 15px;
		text-align: center;
		background: #111;
		color: white;
		transition: 0.3s;
	
	}
	.card:hover
	{
		transform: translateY(-8px);
		background: #24102f;
		border-color: #d580ff;
		box-shadow: 0 8px 20px rgba(128, 0, 128, 0.5);
	}
	.card h2
	{
		color: white;
	}
	.card img
	{
		width: 100%;
		height: 180px;
		object-fit: contain;
	}
	.card h2 
	{
		margin: 15px 0 10px;
	}
	.card p
	{
		line-height: 1.5;
	}
	.card a
	{
		display: inline-block;
		margin-top: 10px;
		padding: 8px 18px;
		text-decoration: none;
		border-radius: 20px;
	}
	.project-side
	{
		position: fixed;
		width: 280px;
		padding: 30px;
		margin: 40px;
		text-align: center;
		background: rgba(225, 225, 225, 0.06);
		border:solid 1px rgba(225, 225, 225, 0.18);
		border-radius: 18px;
		box-shadow: 0 8px 25px rgba(0, 0, 0, 2.5);
	}
	.project-side h2
	{
		font-size: 28px;
		margin-bottom: 15px;
	}
	.project-side p
	{
		line-height: 1.6;
		font-size: 14px;
	}
	.work-line
	{
		width: 60px;
		height: 3px;
		margin: 20px auto;
		border-radius: 5px;
		background: white;

	}
	.project-side span
	{
		display: block;
		margin: 12px 0;
		font-size: 14px;
	}
	.project-layout
	{
		width: 90%;
		max-width: 1200px;
		margin: 40px auto;
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 40px;
	}
	.project-container
	{
		flex: 1;
	}
	.right-box
	{
		width: 60px;
		height: 3px;
		margin: 20px auto;
		border-radius: 5px;
		background: white;
	}
	.project-side span{
		display: block;
		margin: 12px 0;
		font-size: 14px;
	}
	@media screen
	{
		html,body
		{
			height: auto !important;
			min-height: 100% !important;
		}
		.project
		{
			height: auto !important;
			min-height: auto !important;
			overflow: visible !important;
		}
		.card
		{
			height: auto !important;
			min-height: auto !important;
			max-height: none !important;
			page-break-after:auto !important;
			break-after:auto !important;
	}
</style>
