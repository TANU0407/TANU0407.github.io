<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<style type="text/css">
	body{
		margin: 0;
		height: 100vh;
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		font-family: Arial;
	}
	h1{
		margin-bottom: 20px;
	}
	button{
		padding: 10px;
		font-size: 18px;
		cursor: pointer;
	}
</style>
<body>
<h1>Change Background Color</h1>
<button onclick="a()">Onclick</button>
<script type="text/javascript">
	let a = function(){
		document.body.style.background =
		"linear-gradient(black,gray,black)";
	};
</script>
</body>
</html>
