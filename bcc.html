<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<style type="text/css">
	body{
		margin: 0;
		height: 100vh;
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		font-family: Arial;
	}
	h1{
		margin-bottom: 20px;
	}
	button{
		padding: 10px;
		font-size: 18px;
		cursor: pointer;
	}
</style>
<body>
<h1>Background Color Change.</h1>
<button onclick="changeColor()">Change Color</button>
<script type="text/javascript">
	function changeColor()
	{
		let colors = [
			"linear-gradient(black,white,black)",
			"linear-gradient(black,purple,black)",
			"linear-gradient(black,cyan,black)",
			"linear-gradient(black,green,black)",
            "linear-gradient(black,gray,black)",
            "linear-gradient(cyan,gray,cyan)",
            "linear-gradient(black,purple,brown)"
		];
		let random = 
		Math.floor(Math.random() *
			colors.length);
		document.body.style.background = 
		colors[random];
	}
</script>
</body>
</html>
