<html>
<head>
<title></title>
<style>
  table
  {
    background: white;
    border: 2px solid white;
  border-collapse: collapse;
    padding: 15px;
    border-radius: 10px;
    background: gray;
  }
  body
  {
    background: linear-gradient(to right,black,purple);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
 #a
  {
    width: 100%;
    height: 80px;
    font-size: 30px;
    border-radius: 20%;
  }
#b
  {
    width: 100%;
    height: 80px;
    font-size: 30px;
    border-radius: 20%;
    background: linear-gradient(black,white,black);
  }
  input.button
 
  th
  {
    width: 80px;
    height: 60px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
  }
  th:hover
  {
    background: black;
  }
  </style>
</head>
<body bgcolor="black">
  <center>
  <script>
    function pick(val)
    {
      document.getElementById("a").value +=val;
    }
    function clr()
    {
      document.getElementById("a").value="";
    } 
    function Solve()
    {
      var X=document.getElementById("a").value;
      var Y=eval(X);
      document.getElementById("a").value=Y;
    }
    </script>

  <table>
<tr>
<th colspan="3"><input type="text" id="a"></th>
<th ><input type="button" value="C" onclick="clr()" id="b"></th>
</tr>
<tr>
<th><input type="button" value="1" onclick="pick(1)" id="b"></th>
<th><input type="button" value="2" onclick="pick(2)" id="b"></th>
<th><input type="button" value="3" onclick="pick(3)" id="b"></th>
 <th><input type="button" value="+" onclick="pick('+')" id="b"></th>

</tr>
<tr>
<th><input type="button" value="4" onclick="pick(4)" id="b"></th>
<th><input type="button" value="5" onclick="pick(5)" id="b"></th>
<th><input type="button" value="6" onclick="pick(6)" id="b"></th>
<th><input type="button" value="-" onclick="pick('-')" id="b"></th>
</tr>
<tr>
 <th><input type="button" value="7" onclick="pick(7)" id="b"></th>
<th><input type="button" value="8" onclick="pick(8)" id="b"></th>
<th><input type="button" value="9" onclick="pick(9)" id="b"></th>
<th><input type="button" value="*" onclick="pick('*')" id="b"></th>
</tr>

<tr>
 <th><input type="button" value="." onclick="pick('.')" id="b"></th>
<th><input type="button" value="=" onclick="Solve()" id="b"></th>
<th><input type="button" value="0" onclick="pick(0)" id="b"></th>
<th><input type="button" value="/" onclick="pick('/')" id="b"></th>
</tr>
<th><input type="button" value="7" onclick="pick(7)" id="b"></th>
<th><input type="button" value="8" onclick="pick(8)" id="b"></th>
<th><input type="button" value="9" onclick="pick(9)" id="b"></th>
<th><input type="button" value="*" onclick="pick('*')" id="b"></th>
</tr>

</center>
</body>
</html>
