<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<style type="text/css">
	body
	{
		margin: 0;
		padding: 0;
		font-family: Arial,sans-serif;
		background: linear-gradient(to right,purple,gray);
		display: flex;
		justify-content: center;
		align-items: center;
		height: 100vh;
	}
	.container
	{
		width: 350px;
		background: white;
		padding: 20px;
		border-radius:10px;
		text-align: center;
		box-shadow: 0 0 10px black;
	}
	h2
	{
		color: purple;
	}
	input
	{
		width: 70%;
		padding: 10px;
		font-size:16px;
	}
	button
	{
		padding: 10px 15px;
		background: purple;
		color: white;
		border: none;
		cursor: pointer;
		border-radius: 5px;
	}
	button:hover
	{
		background: gray;
	}
	ul
	{
		list-style: none;
		padding: 0;
	}
	list-style{
		background: gray;
		margin-top: 10px;
		padding: 10px;
		border-radius: 5px;
	}
</style>
<body>
<div class="container">
	<h2>To-DO List</h2>
	<input type="text" id="task" placeholder="Enter Task">
	<button onclick="addTask()">Add</button>
	<ul id="list"></ul>
</div>
<script type="text/javascript">
	function addTask()
	{
		let task =
		document.getElementById("task").value;
		if(task === ""){
			alert("Please enter A task");
			return;
		}
		let li =
		document.createElement("li");
		li.innerHTML = task + "<button onclick='removeTask(this)'>Delete</button>";
		document.getElementById("list").appendChild(li);
		document.getElementById("task").value="";
	}
	function removeTask(button) {
		button.parentElement.remove();
	}
</script>
</body>
</html>
